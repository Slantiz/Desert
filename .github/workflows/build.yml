name: Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Build runnable jar
        run: ./mvnw --batch-mode package

      - uses: actions/upload-artifact@v4
        with:
          name: epicgame-jar
          path: target/epicgame-*.jar
