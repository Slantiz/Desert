name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: epicgame-windows.jar
          - os: ubuntu-latest
            asset: epicgame-linux.jar
          - os: macos-latest
            asset: epicgame-macos-arm64.jar

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # ./mvnw is a shell script, so every runner needs bash
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Build jar
        run: ./mvnw --batch-mode package

      - name: Name the jar after its platform
        run: |
          mkdir -p dist
          cp target/epicgame-[0-9]*.jar "dist/${{ matrix.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.jar \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
